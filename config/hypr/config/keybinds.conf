# ------------------ #
#     Main Binds     #
# ------------------ #

$mainMod = SUPER # Sets "Windows" key as main modifier

# Panels reboot
bind = $mainMod SHIFT, B, exec, ~/dotfiles/scripts/start_waybar.sh
# bind = $mainMod SHIFT, B, exec, ~/dotfiles/scripts/start_hyprpanel.sh

# Copilot button to Super remap
bind = SUPER, C, pass, SUPER



# ------------------ #
#    App Launchers   #
# ------------------ #

bind = $mainMod, grave, exec, $terminal
# bind = $mainMod, F, exec, $browser
bind = $mainMod, E, exec, $fileManager


# System Menus
bind = $mainMod, space, exec, $menu
bind = $mainMod, B, exec, ~/dotfiles/bin/bzmenu -l fuzzel
bind = $mainMod, W, exec, nmgui # ~/dotfiles/bin/iwmenu -l fuzzel
# bind = $mainMod, Z, exec, ~/OCR4Linux/OCR4Linux.sh --lang eng
bind = $mainMod, Z, exec, ~/OCR4Linux/OCR4Linux.sh --lang eng+rus
bind = $mainMod SHIFT, Z, exec, ~/OCR4Linux/OCR4Linux.sh --lang rus

# calendar
# google search


# ------------------ #
#   System Actions   #
# ------------------ #

bind = $mainMod, Q, exec, ~/dotfiles/scripts/killactive.sh
bind = $mainMod, P, exec, ~/dotfiles/scripts/resolution_change.sh
bind = $mainMod SHIFT, I, exec, ~/dotfiles/scripts/window_info.sh
bind = $mainMod SHIFT, D, exec, code ~/dotfiles/

bind = , PRINT, exec, hyprshot-gui
bind = $mainMod SHIFT, S, exec, hyprshot -z -m region # window / active / region

bind = $mainMod, PRINT, exec, kooha
bind = $mainMod, L, exec, hyprlock
# bind = $mainMod, J, togglesplit
bind = $mainMod, F, togglefloating
bind = $mainMod SHIFT, F, fullscreen

# Clipboard
bind = $mainMod, V, exec, ~/dotfiles/scripts/cliphist-fuzzel-img.sh # With imgs
# bind = $mainMod, V, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy # Without imgs


# ------------------ #
#   Window Control   #
# ------------------ #

# Resize window
bind = $mainMod SHIFT, left, resizeactive, -50 0
bind = $mainMod SHIFT, right, resizeactive, 50 0
bind = $mainMod SHIFT, up, resizeactive, 0 -50
bind = $mainMod SHIFT, down, resizeactive, 0 50

# Move focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move/resize windows with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod SHIFT, mouse:272, resizewindow



# ------------------ #
#     Workspaces     #
# ------------------ #

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, F1, workspace, 6
bind = $mainMod, F2, workspace, 7
bind = $mainMod, F3, workspace, 8
bind = $mainMod, F4, workspace, 9
bind = $mainMod, F5, workspace, 10

# Move active window to a workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, F1, movetoworkspace, 6
bind = $mainMod SHIFT, F2, movetoworkspace, 7
bind = $mainMod SHIFT, F3, movetoworkspace, 8
bind = $mainMod SHIFT, F4, movetoworkspace, 9
bind = $mainMod SHIFT, F5, movetoworkspace, 10


# ------------------ #
#      Fn keys       #
# ------------------ #

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
