windowrulev2 = suppressevent maximize, class:.*



# Waybay widgets
windowrulev2 = float, title:^(.*Network Manager.*)$
windowrulev2 = pin, title:^(.*Network Manager.*)$
windowrulev2 = move 76% 3%, title:^(.*Network Manager.*)$

windowrulev2 = float, title:^(Volume Control)$
windowrulev2 = pin, title:^(Volume Control)$
windowrulev2 = move 69.5% 3%, title:^(Volume Control)$

windowrulev2 = float, title:^(.*Hyprshot.*)$
windowrulev2 = pin, title:^(.*Hyprshot.*)$


windowrulev2 = float, title:^(Select a Folder)$

# Browser Picture in Picture
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = move 69.5% 4%, title:^(Picture-in-Picture)$


# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
