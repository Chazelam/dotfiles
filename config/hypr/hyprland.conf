#---------------------------------------------


#---------------------------------------------
# Displays
#---------------------------------------------
monitor = eDP-1, 1920x1200@60, 0x1080, 1, bitdepth, 8
monitor = HDMI-A-1, 1920x1080@60, 0x0, 1, bitdepth, 8

# monitor = eDP-1, 1920x1080@60, 0x0, 1
# monitor = HDMI-A-1, 1920x1080@60, 0x0, 1, mirror, eDP-1

#---------------------------------------------
# Variables
#---------------------------------------------
$terminal = kitty
$fileManager = dolphin #nautilus
$menu = fuzzel
$browser = firefox

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GTK_THEME, Adwaita-dark
env = CLIPHIST_MAX_ITEMS,100


#---------------------------------------------
# Autostart
#---------------------------------------------
source = ~/.config/hypr/config/autostart.conf

source = ~/.config/hypr/config/general.conf

source = ~/.config/hypr/config/input.conf


##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules


workspace = 1,  monitor:eDP-1
workspace = 2,  monitor:eDP-1
workspace = 3,  monitor:eDP-1
workspace = 4,  monitor:eDP-1
workspace = 5,  monitor:eDP-1

workspace = 6,  monitor:HDMI-A-1
workspace = 7,  monitor:HDMI-A-1
workspace = 8,  monitor:HDMI-A-1
workspace = 9,  monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1


#---------------------------------------------
# Imports
#---------------------------------------------

source = ~/.config/hypr/config/window_rules.conf


source = ~/.config/hypr/config/keybinds.conf

